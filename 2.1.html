<!DOCTYPE html>
<html>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>瑜神游戏中心</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1px;
      position: sticky; /* 使元素在页面滚动时保持在顶部 */
      top: 0; /* 粘性定位的起始位置 */
      z-index: 1000; /* 确保其位于其他非固定定位的内容之上 */
    }
    .logo img {
      width: 100px;
      height: 100px;
    }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 150px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }
    .card h3 {
      margin: 0;
      font-size: 18px;
      color: #007BFF;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: opacity 1s ease-out;
    }
    @keyframes textChange {
      0% { opacity: 1; transform: scale(1); }
      25% { opacity: 1; transform: scale(1.2); }
      50% { opacity: 0; transform: scale(1); }
      75% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animated-text::before {
      content: "瑜神号";
      font-size: 48px;
      font-weight: bold;
      color: white;
      animation-name: textChange;
      animation-duration: 1.5s;
      animation-timing-function: ease-in-out;
      animation-fill-mode: forwards;
    }
    .animated-text::after {
      content: "启动！";
      font-size: 48px;
      font-weight: bold;
      color: white;
      animation-name: textChange;
      animation-duration: 1.5s;
      animation-delay: 1.5s;
      animation-timing-function: ease-in-out;
      animation-fill-mode: forwards;
    }
    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .flash-effect {
      animation-name: flash;
      animation-duration: 0.5s;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    .fade-out {
      animation-name: fadeOut;
      animation-duration: 1s;
      animation-fill-mode: forwards;
    }

    /* 新增第二段动画样式 */
    #second-animation {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      pointer-events: none; /* 防止点击干扰 */
    }
    #second-animation img {
      width: 100px;
      height: 100px;
      animation: focusBlur 2s ease-in-out, scaleUp 2s 2s ease-in-out;
    }
    @keyframes focusBlur {
      0%, 100% { filter: blur(0px); transform: scale(1); }
      50% { filter: blur(5px); transform: scale(1.2); }
    }
    @keyframes scaleUp {
      0% { transform: scale(1); }
      100% { transform: scale(3); }
    }

    /* 白色遮罩样式 */
    #white-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      z-index: 10001;
      opacity: 0;
      pointer-events: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeOutWhite {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .fade-in {
      animation: fadeIn 1s ease-in-out forwards;
    }
    .fade-out-white {
      animation: fadeOutWhite 0.5s ease-in-out forwards;
    }
  </style>
</head>
<body onload="startLoading()">
  <!-- 遮罩层 -->
  <div id="loading-overlay" class="flash-effect">
    <div class="animated-text"></div>
    <audio id="loading-audio" src="/loading.mp3"></audio>
  </div>

  <!-- 第二段动画 -->
  <div id="second-animation" style="display: none;">
    <img src="logo.svg" alt="Animation SVG" />
  </div>

  <!-- 白色遮罩 -->
  <div id="white-overlay"></div>

  <!-- Logo -->
  <div class="logo">
    <img src="logo.svg" alt="Logo SVG" />
  </div>

  <div id="card-container" class="card-container"> <h2>超级游戏服务器</h2></div>

  <script>
    function loadFilesFromCache() {
      const cachedFiles = localStorage.getItem('fileList');
      if (cachedFiles) {
        const files = JSON.parse(cachedFiles);
        renderFiles(files);
        return true;
      }
      return false;
    }

    function loadFilesFromServer() {
      fetch('/files')
        .then(response => response.json())
        .then(data => {
          localStorage.setItem('fileList', JSON.stringify(data));
          renderFiles(data);
        });
    }

    function renderFiles(files) {
      const container = document.getElementById('card-container');
      container.innerHTML = '';
      files.forEach(file => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${file.name}</h3>`;
        card.onclick = () => {
          window.location.href = file.path;
          document.documentElement.requestFullscreen();
        };
        container.appendChild(card);
      });
    }

    function playAudioAndHideOverlay() {
      var audio = document.getElementById('loading-audio');
      var overlay = document.getElementById('loading-overlay');

      audio.play().then(function() {
        console.log('Audio playback started.');
      }).catch(function(error) {
        console.error('Error playing audio:', error);
      });

      overlay.classList.add('fade-out');
      setTimeout(function() {
        overlay.style.display = 'none';
        startSecondAnimation(); // 第一段动画结束后，启动第二段动画
      }, 1000);
    }

    function startSecondAnimation() {
      const secondAnimation = document.getElementById('second-animation');
      const whiteOverlay = document.getElementById('white-overlay');

      secondAnimation.style.display = 'block'; // 显示第二段动画

      // SVG 放大 3 倍后固定住
      setTimeout(() => {
        secondAnimation.style.transform = 'translate(-50%, -50%) scale(3)';

        // 显示白色遮罩
        whiteOverlay.classList.add('fade-in');

        // 白色遮罩淡出
        setTimeout(() => {
          whiteOverlay.classList.remove('fade-in');
          whiteOverlay.classList.add('fade-out-white');

          // 动画结束后隐藏 SVG 和白色遮罩
          setTimeout(() => {
            secondAnimation.style.display = 'none';
            whiteOverlay.style.display = 'none';
          }, 500); // 白色遮罩淡出时间
        }, 1000); // 白色遮罩停留时间
      }, 4000); // SVG 放大 3 倍后固定住的时间
    }

    function startLoading() {
      setTimeout(playAudioAndHideOverlay, 6000);
      var overlay = document.getElementById('loading-overlay');
      overlay.addEventListener('click', playAudioAndHideOverlay);

      const isCached = loadFilesFromCache();
      if (!isCached || performance.navigation.type === 1) {
        loadFilesFromServer();
      }
    }
  </script>
</body>
</html>
